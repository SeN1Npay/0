info:
  name: addSpareparts
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/Maven/Spareparts/addSpareparts?name=Масляный фильтр&article=OF-1234&price=500&stock=20
  params:
    - name: name
      value: Масляный фильтр
      type: query
    - name: article
      value: OF-1234
      type: query
